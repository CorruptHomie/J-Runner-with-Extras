<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="J-Runner Window" description="Fixed-size dark app window: custom title bar, group-box columns, session log, status bar." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="min-height:100vh;background:#0d0d0f;display:flex;justify-content:center;padding:16px;font-family:'Segoe UI',-apple-system,'Open Sans',system-ui,sans-serif">
<div style="width:832px;background:#161619;box-shadow:0 10px 40px rgba(0,0,0,.55);display:flex;flex-direction:column">
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.TitleBar" menu="{{ menu }}" right="{{ version }}" hint-size="100%,36px"></x-import>
<div style="display:flex;gap:10px;padding:10px;align-items:flex-start">
<div style="flex:1;display:flex;flex-direction:column;gap:8px">
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.GroupBox" title="Nand" hint-size="100%,86px"><div style="display:flex;gap:6px"><x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.Button" style="width:72px;height:52px;white-space:normal;line-height:1.25" hint-size="72px,52px">Read Nand</x-import><x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.Button" style="width:72px;height:52px;white-space:normal;line-height:1.25" hint-size="72px,52px">Create ECC</x-import><x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.Button" style="width:72px;height:52px;white-space:normal;line-height:1.25" hint-size="72px,52px">Write Nand</x-import></div></x-import>
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.ProgressBar" value="{{ progress }}" hint-size="100%,20px"></x-import>
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.LogConsole" lines="{{ log }}" height="{{ logHeight }}" hint-size="100%,220px"></x-import>
</div>
<div style="width:300px;display:flex;flex-direction:column;gap:8px">
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.Tabs" tabs="{{ tabs }}" value="{{ tab }}" onChange="{{ setTab }}" hint-size="100%,180px"><div style="min-height:120px;color:#96969e;font-size:12px">Panel contents go here.</div></x-import>
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.DeviceCard" hint-size="100%,118px"></x-import>
</div>
</div>
<div style="flex:1"></div>
<x-import component-from-global-scope="JRunnerPremiumDesignSystem_5a2f40.StatusBar" items="{{ status }}" hint-size="100%,22px"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:864,&quot;height&quot;:720},&quot;version&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;V4.0.0devpre4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { tab: "Nand Info" };
  renderVals() {
    return {
      menu: ["Tools", "Nand", "Advanced"],
      version: this.props.version ?? "V4.0.0devpre4",
      progress: this.props.progress ?? 0,
      logHeight: 220,
      tabs: ["Nand Info", "KV Info", "Bad Blocks"],
      tab: this.state.tab,
      setTab: (t) => this.setState({ tab: t }),
      status: [{ label: "XeBuild", value: "1.21" }, { label: "Dashlaunch", value: "3.21" }],
      log: [
        "J-Runner Premium",
        "Session: 07/30/2026 3:27:15",
        { text: "Status: Up to date", severity: "ok" },
      ],
    };
  }
}
</script>
</body>
</html>
