<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}.c{height:40px;border:1px solid var(--jr-border-subtle)}</style></head><body>
<div class="g" style="grid-template-columns:repeat(11,1fr)">
<div class="sw"><div class="c" style="background:var(--xell-red)"></div><div class="v">red</div></div><div class="sw"><div class="c" style="background:var(--xell-blue)"></div><div class="v">blue</div></div><div class="sw"><div class="c" style="background:var(--xell-green)"></div><div class="v">green</div></div><div class="sw"><div class="c" style="background:var(--xell-black)"></div><div class="v">black</div></div><div class="sw"><div class="c" style="background:var(--xell-white)"></div><div class="v">white</div></div><div class="sw"><div class="c" style="background:var(--xell-grey)"></div><div class="v">grey</div></div><div class="sw"><div class="c" style="background:var(--xell-brown)"></div><div class="v">brown</div></div><div class="sw"><div class="c" style="background:var(--xell-purple)"></div><div class="v">purple</div></div><div class="sw"><div class="c" style="background:var(--xell-yellow)"></div><div class="v">yellow</div></div><div class="sw"><div class="c" style="background:var(--xell-orange)"></div><div class="v">orange</div></div><div class="sw"><div class="c" style="background:var(--xell-pink)"></div><div class="v">pink</div></div>
</div></body></html>
