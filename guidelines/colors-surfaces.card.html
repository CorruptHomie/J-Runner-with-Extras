<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)">
<div class="sw"><div class="chip" style="background:var(--jr-window-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Window</div><div class="v">--jr-window-bg<br>#161619</div></div><div class="sw"><div class="chip" style="background:var(--jr-panel-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Panel</div><div class="v">--jr-panel-bg<br>#1e1e22</div></div><div class="sw"><div class="chip" style="background:var(--jr-raised-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Raised</div><div class="v">--jr-raised-bg<br>#2d2d33</div></div><div class="sw"><div class="chip" style="background:var(--jr-hover-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Hover</div><div class="v">--jr-hover-bg<br>#3c3c43</div></div><div class="sw"><div class="chip" style="background:var(--jr-pressed-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Pressed</div><div class="v">--jr-pressed-bg<br>#242429</div></div><div class="sw"><div class="chip" style="background:var(--jr-field-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Field</div><div class="v">--jr-field-bg<br>#111113</div></div>
</div></body></html>
