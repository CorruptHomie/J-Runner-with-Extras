<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip" style="background:var(--jr-border);border-color:var(--jr-border-subtle)"></div><div class="n">Border</div><div class="v">--jr-border<br>#3e3e45</div></div><div class="sw"><div class="chip" style="background:var(--jr-border-subtle);border-color:var(--jr-border-subtle)"></div><div class="n">Border subtle</div><div class="v">--jr-border-subtle<br>#2e2e34</div></div><div class="sw"><div class="chip" style="background:var(--jr-row-alt-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Row alt</div><div class="v">--jr-row-alt-bg<br>#1a1a1e</div></div><div class="sw"><div class="chip" style="background:var(--jr-track-bg);border-color:var(--jr-border-subtle)"></div><div class="n">Progress track</div><div class="v">--jr-track-bg<br>#121214</div></div>
</div></body></html>
