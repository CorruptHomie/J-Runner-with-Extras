<!-- @dsCard group="Colors" viewport="700x150" name="XeLL Customizer web scale" subtitle="Second surface: shadcn slate-dark, plus its blue→purple heading gradient" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr) 1.6fr">
<div class="sw"><div class="chip" style="background:var(--xc-background);border-color:var(--jr-border-subtle)"></div><div class="n">Background</div><div class="v">--xc-background<br>oklch(.129 .042 264.7)</div></div><div class="sw"><div class="chip" style="background:var(--xc-card);border-color:var(--jr-border-subtle)"></div><div class="n">Card</div><div class="v">--xc-card<br>oklch(.208 .042 265.8)</div></div><div class="sw"><div class="chip" style="background:var(--xc-muted);border-color:var(--jr-border-subtle)"></div><div class="n">Muted</div><div class="v">--xc-muted<br>oklch(.279 .041 260.0)</div></div><div class="sw"><div class="chip" style="background:var(--xc-destructive);border-color:var(--xc-destructive)"></div><div class="n">Destructive</div><div class="v">--xc-destructive<br>oklch(.704 .191 22.2)</div></div>
<div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;background:var(--xc-background);border-color:var(--xc-border)"><span style="font:700 20px var(--jr-font-ui);background:linear-gradient(to right,var(--xc-heading-from),var(--xc-heading-to));-webkit-background-clip:text;background-clip:text;color:transparent">XeLL Theme Customizer</span></div><div class="n">Heading gradient</div><div class="v">--xc-heading-from → --xc-heading-to</div></div>
</div></body></html>
