<!-- @dsCard group="Brand" viewport="700x170" name="Elevation &amp; scrim" subtitle="The app is flat: value steps, not shadows. Only windows cast one." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="width:170px;height:80px;background:var(--jr-panel-bg);border:1px solid var(--jr-border-subtle);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--jr-text-secondary)">Panel — no shadow</div>
<div style="width:170px;height:80px;background:var(--jr-panel-bg);border:1px solid var(--jr-border);border-radius:12px;box-shadow:var(--jr-shadow-dialog);display:flex;align-items:center;justify-content:center;font-size:11px">Dialog — --jr-shadow-dialog</div>
<div style="position:relative;width:170px;height:80px;background:var(--jr-panel-bg);border:1px solid var(--jr-border-subtle);border-radius:6px;overflow:hidden"><div style="position:absolute;inset:0;background:var(--jr-scrim);display:flex;align-items:center;justify-content:center;font-size:11px">--jr-scrim 45%</div></div>
</div></body></html>
