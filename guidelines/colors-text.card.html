<!-- @dsCard group="Colors" viewport="700x150" name="Text" subtitle="Primary, secondary, disabled - plus the two inverse marks" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--jr-text-primary);border-color:var(--jr-border-subtle)"></div><div class="n">Primary</div><div class="v">--jr-text-primary<br>#e8e8eb</div></div><div class="sw"><div class="chip" style="background:var(--jr-text-secondary);border-color:var(--jr-border-subtle)"></div><div class="n">Secondary</div><div class="v">--jr-text-secondary<br>#96969e</div></div><div class="sw"><div class="chip" style="background:var(--jr-text-disabled);border-color:var(--jr-border-subtle)"></div><div class="n">Disabled</div><div class="v">--jr-text-disabled<br>#6e6e76</div></div><div class="sw"><div class="chip" style="background:var(--jr-text-on-accent);border-color:var(--jr-border-subtle)"></div><div class="n">On accent</div><div class="v">--jr-text-on-accent<br>#141414</div></div><div class="sw"><div class="chip" style="background:var(--jr-tick);border-color:var(--jr-border-subtle)"></div><div class="n">Tick</div><div class="v">--jr-tick<br>#141812</div></div>
</div></body></html>
