<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr) 1.4fr">
<div class="sw"><div class="chip" style="background:var(--jr-accent);border-color:var(--jr-accent)"></div><div class="n">Accent</div><div class="v">--jr-accent<br>#74c757</div></div><div class="sw"><div class="chip" style="background:var(--jr-accent-light);border-color:var(--jr-accent-light)"></div><div class="n">Accent light (hover)</div><div class="v">--jr-accent-light<br>#a1e082</div></div><div class="sw"><div class="chip" style="background:var(--jr-accent-dim);border-color:var(--jr-accent-dim)"></div><div class="n">Accent dim (selection)</div><div class="v">--jr-accent-dim<br>#468037</div></div>
<div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;background:var(--jr-accent);color:var(--jr-text-on-accent);font-weight:700;border-radius:5px;border-color:var(--jr-accent)">Program</div><div class="n">Accent buttons take a black label, always bold</div><div class="v">--jr-text-on-accent on --jr-accent</div></div>
</div></body></html>
