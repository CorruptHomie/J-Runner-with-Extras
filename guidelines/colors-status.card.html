<!-- @dsCard group="Colors" viewport="700x150" name="Status &amp; chrome" subtitle="Danger, close-button glyphs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div class="sw"><div class="chip" style="background:var(--jr-danger);border-color:var(--jr-danger)"></div><div class="n">Danger</div><div class="v">--jr-danger<br>#d65a50</div></div><div class="sw"><div class="chip" style="background:var(--jr-chrome-glyph);border-color:var(--jr-border-subtle)"></div><div class="n">Chrome glyph</div><div class="v">--jr-chrome-glyph<br>#babac1</div></div><div class="sw"><div class="chip" style="background:var(--jr-chrome-glyph-hover);border-color:var(--jr-border-subtle)"></div><div class="n">Chrome glyph hover</div><div class="v">--jr-chrome-glyph-hover<br>#f0f0f5</div></div>
</div></body></html>
