<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Designer numbers, not a 4/8 grid — 6px and 10px both appear" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--jr-window-bg);color:var(--jr-text-primary);font:400 var(--jr-text-sm)/1.3 var(--jr-font-ui)}body{padding:14px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:44px;border:1px solid var(--jr-border-subtle)}.n{font-size:11px;color:var(--jr-text-primary)}.v{font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}.r{display:flex;align-items:center;gap:8px;margin-bottom:4px}.b{height:12px;background:var(--jr-accent-dim)}.l{width:150px;font-size:10px;color:var(--jr-text-secondary);font-family:var(--jr-font-mono)}</style></head><body>
<div class="r"><span class="l">--jr-space-1</span><span class="b" style="width:8px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">2px</span></div><div class="r"><span class="l">--jr-space-2</span><span class="b" style="width:16px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">4px</span></div><div class="r"><span class="l">--jr-space-3</span><span class="b" style="width:24px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">6px</span></div><div class="r"><span class="l">--jr-space-4</span><span class="b" style="width:32px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">8px</span></div><div class="r"><span class="l">--jr-space-5</span><span class="b" style="width:40px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">10px</span></div><div class="r"><span class="l">--jr-space-6</span><span class="b" style="width:48px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">12px</span></div><div class="r"><span class="l">--jr-space-7</span><span class="b" style="width:56px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">14px</span></div><div class="r"><span class="l">--jr-space-8</span><span class="b" style="width:64px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">16px</span></div><div class="r"><span class="l">--jr-space-9</span><span class="b" style="width:80px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">20px</span></div><div class="r"><span class="l">--jr-space-10</span><span class="b" style="width:96px"></span><span style="font-size:10px;color:var(--jr-text-secondary)">24px</span></div>
</body></html>
